[project]
name = "llm-bot"
version = "1.0.0"
description = "Telegram LLM chat bot: streamed drafts, Stop button, topics, rich messages"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1"]

[project.scripts]
llm-bot = "llm_bot.__main__:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["llm_bot"]

[tool.setuptools.package-data]
llm_bot = ["widget_prompt.txt"]
