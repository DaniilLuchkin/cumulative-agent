<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cumulative Agent</title>
<style>body{font:15px system-ui;max-width:1100px;margin:30px auto;padding:0 20px;background:#10151d;color:#dce7f3}input,button{padding:10px;background:#1f2c3c;color:inherit;border:1px solid #50637a;border-radius:5px}section{border:1px solid #33445b;border-radius:8px;padding:14px;margin:14px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}h2{font-size:18px}label{display:block;margin-bottom:12px}</style>
<h1>Cumulative Agent</h1><p>Очередь, ресурсы и история. Обновление каждые 10 секунд.</p>
<label>API token <input id="token" type="password" autocomplete="off"> <button id="connect">Подключиться</button></label><p id="state">Токен хранится только в памяти этой страницы.</p>
<section><h2>Метрики</h2><pre id="metrics"></pre></section>
<section><h2>Пользовательская очередь</h2><pre id="queue"></pre></section>
<section><h2>Текущие задачи</h2><pre id="running"></pre></section>
<section><h2>Фоновые задачи</h2><pre id="background"></pre></section>
<section><h2>Проекты</h2><pre id="projects"></pre></section>
<section><h2>Модели и ресурсы</h2><pre id="resources"></pre></section>
<section><h2>Недавняя активность</h2><pre id="events"></pre></section>
<script>
let token='',busy=false;
const show=(id,data)=>document.getElementById(id).textContent=JSON.stringify(data,null,2);
async function get(path){const r=await fetch('/api/'+path,{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
async function refresh(){if(!token||busy)return;busy=true;try{const [m,t,p,r,e]=await Promise.all(['metrics','tasks','projects','resources','events'].map(get));show('metrics',m);show('queue',t.filter(x=>x.type==='user'));show('running',t.filter(x=>x.status==='running'));show('background',t.filter(x=>x.type!=='user'));show('projects',p);show('resources',r);show('events',e);document.getElementById('state').textContent='Обновлено: '+new Date().toLocaleTimeString()}catch(e){document.getElementById('state').textContent=e.message}finally{busy=false}}
document.getElementById('connect').onclick=()=>{token=document.getElementById('token').value;document.getElementById('token').value='';refresh()};setInterval(refresh,10000);
</script></html>
