database: data/agent.sqlite3
project_roots: [] # explicit absolute allowlisted roots for project registration
telegram_webapp_url: "" # public HTTPS URL ending in /app, or TELEGRAM_WEBAPP_URL env
telegram_claim_first_user: false # installer enables single first-private-message claim
telegram_mode: chat # chat: streamed LLM replies (needs an enabled model); tasks: text becomes a task
chat_history_bytes: 24000 # conversation context sent per turn
chat_max_tokens: 4096
timezone: UTC # can be changed per Telegram owner with /timezone Europe/Moscow
resource_auto_sync: true # read-only metadata task, only when OpenRouter key exists
resource_sync_seconds: 3600
telegram_init_data_max_age_seconds: 3600
providers:
  openrouter:
    balance: null # optional manual USD balance; reservations decrement it
    requests_per_minute: 20
    tracking: manual/config
limits:
  daily_cost_limit: 0.0 # no paid calls until explicitly configured
  background_cost_limit: 0.0
  task_cost_limit: 0.10
  max_concurrent_agents: 1
  max_tokens: 8192
  max_steps: 8 # six fixed coding actions plus test commands/optional commit
  timeout_seconds: 180
  poll_seconds: 10
  planner_cooldown_seconds: 3600
  max_background_backlog: 8
  minimum_expected_value: 1
models:
  - id: openai/gpt-4o-mini # example only; verify current prices before enabling
    provider: openrouter
    enabled: false
    groups: [cheap, general]
    capabilities: [general, coding]
    input_price: 0.15 # USD / million tokens, example not a live quote
    output_price: 0.60
    context_size: 128000
    max_output_tokens: 2048
    requests_per_minute: 10
    quota_remaining: null # manual token quota; null means unknown, not unlimited upstream
    resets_at: null
    reset_period_seconds: null
